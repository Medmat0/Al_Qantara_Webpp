<div class="revues-main-container">

  <div class="filters-bar">
    <button class="add-revue-button" routerLink="/revues/add-revue">Ajouter une Revue</button>

    <div class="search-bar">
      <input type="text" placeholder="Search..." />
      <button type="button">Search</button>
    </div>
    <div class ="filters">
      <label for="filter">Filter by:</label>
      <select id="filter">
        <option value="all">All</option>
        <option value="category1">Category 1</option>
        <option value="category2">Category 2</option>
      </select>
    </div>
  </div>
  <div class="revue-listing">

    <div class="revue-item-container" *ngFor="let revue of revues" (click)="onRevueClick(revue)">
      <app-revue-item [revue]="revue"></app-revue-item>
    </div>

  </div>
  <div class="pages-number">


  </div>
</div>
