<div class="modal-backdrop" (click)="close.emit()"></div>
<div class="modal">
  <div class="modal-header">
    <h3>Nouvelle conversation</h3>
    <button class="close-btn" (click)="close.emit()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="search-container">
    <div class="search-input-wrapper">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input
        type="text"
        class="search-input"
        placeholder="Rechercher un utilisateur..."
        [(ngModel)]="searchTerm"
        #searchInput
      >
      <button
        class="clear-search"
        *ngIf="searchTerm"
        (click)="clearSearch(); searchInput.focus()"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="users-container">
    <div class="users-list" *ngIf="filteredUsers.length > 0">
      <div class="user-item" *ngFor="let user of filteredUsers" (click)="selectUser(user.id)">
        <div class="user-avatar">
          <img *ngIf="user.photoProfil" [src]="user.photoProfil" alt="avatar" />
          <div *ngIf="!user.photoProfil" class="avatar-initials">
            {{ user.prenom[0] }}{{ user.nom[0] }}
          </div>
        </div>
        <div class="user-info">
          <div class="user-name">{{ user.prenom }} {{ user.nom }}</div>
          <div class="user-status" [ngClass]="user.statutEnLigne">
            <span class="status-indicator"></span>
            {{ user.statutEnLigne === 'EN_LIGNE' ? 'En ligne' : 'Hors ligne' }}
          </div>
        </div>
      </div>
    </div>

    <div class="no-results" *ngIf="filteredUsers.length === 0">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <p>Aucun utilisateur trouvé</p>
      <small>Essayez avec d'autres mots-clés</small>
    </div>
  </div>

  <div class="modal-footer">
    <button class="cancel-btn" (click)="close.emit()">Annuler</button>
  </div>
</div>
