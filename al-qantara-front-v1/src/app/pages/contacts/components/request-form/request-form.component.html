<form class="request-form">
  <div class="form-group">
    <label for="name">Nom</label>
    <input id="name" type="text" placeholder="Nom" name="name" required />
  </div>

  <div class="form-group">
    <label for="firstName">Prénom</label>
    <input id="firstName" type="text" placeholder="Prénom" name="firstName" />
  </div>

  <div class="form-group">
    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" placeholder="Adresse e-mail" name="email" required />
  </div>

  <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" placeholder="Votre message" name="message" rows="5" required></textarea>
  </div>

  <button type="submit">Envoyer</button>
</form>
