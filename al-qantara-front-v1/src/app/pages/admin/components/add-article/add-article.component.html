<div class="add-article-container">
  <h2>Ajouter un Article</h2>

  <!-- Message de succès -->
  <div class="success-message" *ngIf="successMessage" style="background-color: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
    {{ successMessage }}
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Titre de l'article</label>
      <input
        type="text"
        id="title"
        formControlName="title"
        placeholder="Entrez le titre de l'article"
      >
    </div>

    <div class="form-group">
      <label for="author">Auteur</label>
      <input
        type="text"
        id="author"
        formControlName="author"
        placeholder="Entrez le nom de l'auteur"
      >
    </div>

    <div class="form-group">
      <label for="revue">Revue</label>
      <select id="revue" class="form-control" style="width:100%;" formControlName="revue">
        <option value="" disabled selected>Choisissez une revue</option>
        <option *ngFor="let revue of revues" [value]="revue.id">{{ revue.titre }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="categories">Catégories</label>
      <select id="categories" class="form-control" style="width:100%;" formControlName="categorie">
        <option value="" disabled selected>Choisissez une catégorie</option>
        <option *ngFor="let nom of categoriesNoms" [value]="nom">{{ nom }}</option>
      </select>
    </div>

    <div class="form-group">
      <label>Contenu</label>
      <div class="editor">
        <ngx-editor-menu [editor]="editor" [toolbar]="toolbar">
        </ngx-editor-menu>
        <ngx-editor
          [editor]="editor"
          formControlName="content"
          [placeholder]="'Écrivez votre article ici...'"
        >
        </ngx-editor>
      </div>
    </div>

    <button
      type="submit"
      class="submit-btn"
      [disabled]="!form.valid"
    >
      Publier l'article
    </button>
  </form>
</div>
