<div class="filters-bar">
  <div class="search-bar">
    <input
      type="text"
      placeholder="Rechercher un événement..."
      [(ngModel)]="searchTerm"
    />
  </div>
  <div class="filters">
    <label for="filter">Trier par :</label>
    <select id="filter" [(ngModel)]="selectedFilter" (change)="onFilterChange(selectedFilter)">
      <option value="none">Aucun</option>
      <option value="most-recent">Plus récents</option>
      <option value="most-old">Plus anciens</option>
      <option value="most-popular">Plus populaires</option>
    </select>
  </div>
</div>

<div class="event-listing">
  <div
    class="event-item-container"
    *ngFor="let event of filteredEvenements"
    (click)="openModal(event)">
    <app-event-item [event]="event"></app-event-item>
  </div>
</div>

<div class="pagination">
  <button
    [disabled]="currentPage === 1"
    (click)="changePage(currentPage - 1)">
    Previous
  </button>
  <span>Page {{ currentPage }} of {{ totalPages }}</span>
  <button
    [disabled]="currentPage === totalPages"
    (click)="changePage(currentPage + 1)">
    Next
  </button>
</div>

<!-- Modal -->
<app-event-modal
  *ngIf="showModal"
  [event]="selectedEvent"
  (participate)="onParticipateToEvenement(selectedEvent)"
  [isParticipating]="isParticipating"
  [participation]="participation"
  [loading]="loading"
  (like)="onLikeEvenement(selectedEvent)"
  [hasLikedEvenement]="hasLikedEvenement"
  [error]="error"
  (unsubscribe)="onUnsubscribeEvenement(selectedEvent)"
  [unsubscribeConfirmed]="unsubscribeConfirmed"
  (comment)="onAddComment(selectedEvent,$event)"
  (close)="closeModal()">
</app-event-modal>
