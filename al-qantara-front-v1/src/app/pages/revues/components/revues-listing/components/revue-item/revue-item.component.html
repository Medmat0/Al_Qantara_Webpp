<div class="revue-item">
  <img
  [src]="getPreviewUrl(revue.fichier)" alt="Revue Image"
  >
  <div class="revue-description">
    <h2>{{ revue.titre }}</h2>
    <h3>Date: {{ revue.mois }} {{revue.annee}}</h3>
    <p>{{revue.description}}</p>
    <div class="stats" *ngIf="showRevueStats">
      <p>👀:{{revue.nombreVues}}</p>
      <div class="download-numbers">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="10px" width="10px"><title>tray-arrow-down</title><path d="M2 12H4V17H20V12H22V17C22 18.11 21.11 19 20 19H4C2.9 19 2 18.11 2 17V12M12 15L17.55 9.54L16.13 8.13L13 11.25V2H11V11.25L7.88 8.13L6.46 9.55L12 15Z" /></svg>
        <p>:{{revue.nombreTelechargements}}</p>
      </div>
    </div>
  </div>
</div>
