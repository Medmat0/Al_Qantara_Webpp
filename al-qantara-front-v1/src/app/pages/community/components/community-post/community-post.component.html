<article class="post-card"> 
  <header class="post-header">
    <div class="post-title-section">
      <h2 class="post-title">{{ post.titre }}</h2>
      <div class="post-meta">
        <div class="author-info">
          <img 
            *ngIf="post.communityLogo" 
            [src]="post.communityLogo" 
            [alt]="'Logo de ' + post.communityNom"
            class="community-avatar" />
          <div class="meta-text">
            <span class="community-name">{{ post.communityNom }}</span>
            <span class="author-details">
              Par {{ post.auteurPrenom }} {{ post.auteurNom }}
            </span>
          </div>
        </div>
        <time class="post-date" [dateTime]="post.dateCreation">
          {{ post.dateCreation | date:'dd/MM/yyyy HH:mm' }}
        </time>
      </div>
    </div>
    
    <button 
      *ngIf="!isOnCommunityPage" 
      [routerLink]="['/communities', post.communityId]"
      class="btn btn-outline community-link"
      (click)="$event.stopPropagation()">
      <span class="btn-icon">🏠</span>
      Voir la communauté
    </button>
  </header>

  <div class="post-tags" *ngIf="post.tags && post.tags.length > 0">
    <span 
      *ngFor="let tag of post.tags" 
      class="tag">
      #{{ tag }}
    </span>
  </div>

  <div class="post-content">
    <p class="post-text">{{ post.contenu }}</p>

    <div class="post-image" *ngIf="post.image">
      <img 
        [src]="post.image" 
        [alt]="'Image du post: ' + post.titre"
        loading="lazy" />
    </div>

    <div class="poll-section" *ngIf="post.isPoll">
      <div class="poll-header">
        <span class="poll-icon">🗳️</span>
        <h3 class="poll-title">Sondage disponible</h3>
      </div>
      
      <ul class="poll-options">
        <li 
          *ngFor="let option of post.pollOptions" 
          class="poll-option">
          {{ option.label }}
        </li>
      </ul>
      
      <div class="poll-deadline">
        <span class="deadline-icon">⏰</span>
        <span>Date limite : {{ post.pollDeadline | date:'dd/MM/yyyy' }}</span>
      </div>
    </div>
  </div>

  <footer class="post-actions">
    <div class="actions-left">
      <button 
        (click)="likeDislikePost($event)"
        class="btn btn-action like-btn"
        [class.liked]="isLiked">
        <span class="btn-icon">{{ isLiked ? '❤️' : '🤍' }}</span>
        <span class="like-count">{{ post.likes?.length || 0 }}</span>
      </button>
      
      <button class="btn btn-action comment-btn">
        <span class="btn-icon">💬</span>
        <span>Commenter</span>
      </button>
      
      
    </div>
    
    <div class="actions-right">
      <button 
        *ngIf="isModerator || userId === post.auteurId" 
        (click)="deletePost($event)"
        class="btn btn-danger delete-btn">
        <span class="btn-icon">🗑️</span>
        <span>Supprimer</span>
      </button>
    </div>
  </footer>

  <!-- Comments Section -->
  <section class="comments-section" *ngIf="post.commentaires && post.commentaires.length">
    <h4 class="comments-title">Commentaires</h4>
    <ng-container *ngFor="let comment of post.commentaires">
      <app-comment
        [comment]="comment"
        [replyFormVisible]="replyFormVisible"
        [replyContent]="replyContent"
        [toggleReplyForm]="toggleReplyForm"
        [addReply]="addReply"
        [likeDislikeComment]="likeDislikeComment"
        [deleteComment]="deleteComment"
        [isModerator]="isModerator"
        [userId]="userId"
      ></app-comment>
    </ng-container>
  </section>
</article>
