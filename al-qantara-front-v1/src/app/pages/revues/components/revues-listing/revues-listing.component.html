<div class="revues-main-container">
  <div class="header-section">
    <h1 class="page-title">Nos Revues</h1>
    <p class="page-subtitle">Découvrez notre collection de revues</p>
  </div>

  <div class="filters-bar">
    <div class="search-section">
      <div class="search-bar">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input
          type="text"
          placeholder="Rechercher une revue..."
          [(ngModel)]="searchTerm"
        />
      </div>
    </div>

    <div class="filters-section">
      <label for="filter" class="filter-label">Trier par:</label>
      <div class="select-wrapper">
        <select id="filter" [(ngModel)]="selectedFilter" (change)="onFilterChange(selectedFilter)">
          <option value="Aucun">Aucun</option>
          <option value="most-recent">Les plus récents</option>
          <option value="most-old">Les plus anciens</option>
          <option value="les plus populaires">Les plus populaires</option>
          <option value="les plus téléchargés">Les plus téléchargés</option>
        </select>
        <svg class="select-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M7 10l5 5 5-5z"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="revue-listing">
    <div class="revue-item-container" *ngFor="let revue of filteredRevues">
      <div class="revue-item-wrapper" (click)="onRevueClick(revue)">
          <app-revue-item [revue]="revue"></app-revue-item>
        <button
          *ngIf="isAdminRoute"
          class="delete-btn"
          (click)="onDeleteRevue(revue.id, $event)"
          aria-label="Supprimer la revue"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19M8,9H16V19H8V9M15.5,4L14.5,3H9.5L8.5,4H5V6H19V4H15.5Z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button
      class="pagination-btn"
      [disabled]="currentPage === 1"
      (click)="changePage(currentPage - 1)"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
      </svg>
      <span>Précédent</span>
    </button>

    <div class="page-info">
      <span class="page-numbers">{{ currentPage }} / {{ totalPages }}</span>
    </div>

    <button
      class="pagination-btn"
      [disabled]="currentPage === totalPages"
      (click)="changePage(currentPage + 1)"
    >
      <span>Suivant</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/>
      </svg>
    </button>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{modalTitle}}</h3>
      <button class="modal-close" (click)="closeModal()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <p>{{modalMessage}}</p>
    </div>
    <div class="modal-actions">
      <button (click)="closeModal()" class="btn btn-secondary">Annuler</button>
      <button (click)="confirmModal()" class="btn btn-danger">Confirmer</button>
    </div>
  </div>
</div>
