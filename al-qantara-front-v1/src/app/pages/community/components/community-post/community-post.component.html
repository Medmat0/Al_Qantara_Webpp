<div class="community-post">
  <h2>{{ post.titre }}</h2>
  <button *ngIf="!isOnCommunityPage" [routerLink]="['/communities', post.communityId]">
    Aller à la communauté
  </button>
  <div class="meta">
    <img *ngIf="post.communityLogo" [src]="post.communityLogo" alt="Logo de la communauté">
    <span>Communauté : {{ post.communityNom }}</span> |
    <span>Auteur : {{ post.auteurPrenom }} {{ post.auteurNom }}</span> |
    <span>Date : {{ post.dateCreation | date:'dd/MM/yyyy HH:mm' }}</span>
  </div>
  <div class="tags">
    <span *ngFor="let tag of post.tags" class="tag">#{{ tag }}</span>
  </div>
  <div class="contenu">
    <p>{{ post.contenu }}</p>
    <button (click)="likeDislikePost($event)">Like | {{ post.likes?.length || 0 }}</button>
    <button *ngIf="isModerator || userId === post.auteurId" (click)="deletePost($event)">Supprimer</button>
  </div>
</div>
