<div class="contacts-container">
  <div class="left-container-contacts">
    <div class="header-section">
      <h1>Contactez-nous !</h1>
      <p>Vous avez une question ? Vous souhaitez nous faire part de vos remarques ?</p>
      <p>Nous sommes à votre écoute !</p>
    </div>

    <div class="social-cards">
      <div class="social-card">
        <div class="social-header">
          <img src="assets/Instagram_logo.jpg" alt="Instagram Logo" class="social-logo" />
          <a href="https://www.instagram.com/alqantara_ma/" target="_blank" class="social-title">&#64;alqantara_ma</a>
        </div>
        <div class="social-embeds">
          <div class="social-embed">
            <iframe src="https://www.instagram.com/p/DLX_4LIIFcY/embed" width="100%" height="500" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
          </div>
          <div class="social-embed">
            <iframe src="https://www.instagram.com/p/DLFwgvdoI5G/embed" width="100%" height="500" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
          </div>
        </div>
      </div>

      <div class="social-card">
        <div class="social-header">
          <img src="assets/LinkedIn_logo.png" alt="LinkedIn Logo" class="social-logo" />
          <a href="https://www.linkedin.com/company/al-qantara-ma" target="_blank" class="social-title">Al Qantara sur LinkedIn</a>
        </div>
        <div class="social-embeds">
          <div class="social-embed">
            <iframe src="https://www.linkedin.com/embed/feed/update/urn:li:activity:7333084628586553365-9jXv" height="450" width="100%" frameborder="0" allowfullscreen="" title="Post LinkedIn"></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="right-container">
    <div class="chatbot-container">
      <div class="chatbot-header">
        <img src="assets/main-icon.jpg" alt="Bot" class="chatbot-avatar" />
        <span>Bot Al Qantara</span>
      </div>
      <div class="chatbot-messages" id="chatbot-messages">
        <div *ngFor="let msg of messages" class="chatbot-message" [ngClass]="msg.from">
          <div class="chatbot-bubble">{{ msg.text }}</div>
        </div>
      </div>
      <form class="chatbot-input-row" (submit)="sendMessage(); $event.preventDefault()" autocomplete="off">
        <input type="text" [(ngModel)]="userMessage" name="userMessage" placeholder="Écrivez votre question..." class="chatbot-input" required />
        <button type="submit" class="chatbot-send-btn">Envoyer</button>
      </form>
    </div>
  </div>
</div>
