<div class="profile-container">
  <div class="profile-header">
    <h1>Mon Profil</h1>
    <p class="description">Gérez les informations associées à votre compte</p>
  </div>

  <div class="profile-content">
    <div class="profile-field">
      <label> Prénom</label>
      <span>{{ user?.prenom }}</span>
    </div>
    <div class="profile-field">
      <label> Nom</label>
      <span>{{ user?.nom }}</span>
    </div>
    <div class="profile-field">
      <label> Email</label>
      <span>{{ user?.email }}</span>
    </div>
    <div class="profile-field">
      <label> Téléphone</label>
      <span>{{ user?.telephone || 'Non renseigné' }}</span>
    </div>

    <div class="action-bar">
      <button routerLink="/profile/edit">✏️ Modifier mon profil</button>
    </div>
  </div>
</div>
