<div class="evenements-main-container">
  <div class="filters-bar">
    <div class="search-bar">
      <input
        type="text"
        placeholder="Rechercher un événement..."
        [(ngModel)]="searchTerm"
      />
    </div>
    <div class="filters">
      <label for="filter">Trier par:</label>
      <select id="filter" [(ngModel)]="selectedFilter" (change)="onFilterChange(selectedFilter)">
        <option value="none">Aucun filtre</option>
        <option value="most-recent">Plus récents d'abord</option>
        <option value="most-old">Plus anciens d'abord</option>
      </select>
    </div>
  </div>

  <!-- Loading state -->
  <div *ngIf="loading" class="loading-message">
    Chargement des événements...
  </div>

  <!-- Error state -->
  <div *ngIf="error" class="error-message">
    {{ error }}
    <button (click)="loadEvents()" class="retry-btn">Réessayer</button>
  </div>

  <!-- Event list -->
  <div class="event-list" *ngIf="!loading && !error">
    <div *ngIf="events.length === 0" class="no-events-message">
      Aucun événement trouvé.
    </div>

    <div
      class="event-item-container"
      *ngFor="let event of filteredEvents"
    >
      <app-event-item [event]="event"></app-event-item>
      <button
        class="delete-btn"
        (click)="onDeleteEvent(event)"
        [class.deleting]="deletingEventId === event.id"
        [disabled]="deletingEventId === event.id"
        aria-label="Supprimer l'événement"
      >
        <svg *ngIf="deletingEventId !== event.id" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20px" width="20px">
          <title>delete</title>
          <path d="M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19M8,9H16V19H8V9M15.5,4L14.5,3H9.5L8.5,4H5V6H19V4H15.5Z" />
        </svg>
        <div *ngIf="deletingEventId === event.id" class="spinner"></div>
      </button>
    </div>
  </div>

  <!-- Pagination -->
  <div class="pagination" *ngIf="events.length > 0">
    <button
      [disabled]="currentPage === 1"
      (click)="changePage(currentPage - 1)"
    >
      Précédent
    </button>
    <span>Page {{ currentPage }} sur {{ totalPages }}</span>
    <button
      [disabled]="currentPage === totalPages"
      (click)="changePage(currentPage + 1)"
    >
      Suivant
    </button>
  </div>

  <!-- Modal -->
  <div class="modal" *ngIf="showModal">
    <div class="modal-content">
      <h3>{{modalTitle}}</h3>
      <p>{{modalMessage}}</p>
      <div class="modal-actions">
        <button (click)="confirmModal()" class="confirm-btn">Confirmer</button>
        <button (click)="closeModal()" class="cancel-btn">Annuler</button>
      </div>
    </div>
  </div>
</div>
