<div class="edit-profile-container">
  <div class="form-box">
    <h2>Modifier votre profil</h2>
    <p class="description">Mettez à jour vos informations personnelles</p>

    <form>
      <div class="form-group">
        <label for="prenom">Prénom</label>
        <input id="prenom" type="text" placeholder="Votre prénom" />
      </div>

      <div class="form-group">
        <label for="nom">Nom</label>
        <input id="nom" type="text" placeholder="Votre nom" />
      </div>

      <div class="form-group">
        <label for="adresse">Adresse</label>
        <input id="adresse" type="text" placeholder="Votre adresse" />
      </div>

      <div class="form-group">
        <label for="telephone">Téléphone</label>
        <input id="telephone" type="text" placeholder="+212..." />
      </div>

      <div class="form-group">
        <label for="city">Ville</label>
        <input id="city" type="text" placeholder="Votre ville" />
      </div>

      <button type="submit">Enregistrer</button>
    </form>
  </div>
</div>
