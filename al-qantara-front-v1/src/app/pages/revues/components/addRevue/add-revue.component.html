<div class="add-revue-container">
  <div class="form-box">
    <h2>Ajouter une Revue</h2>
    <p class="description">Remplissez les informations ci-dessous pour publier une revue</p>

    <form>
      <div class="form-group">
        <label for="titre">Titre</label>
        <input id="titre" type="text" placeholder="Titre de la revue" />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <input id="description" type="text" placeholder="Description de la revue" />
      </div>

      <div class="form-group">
        <label for="mois">Mois</label>
        <input id="mois" type="text" placeholder="Ex : Janvier" />
      </div>

      <div class="form-group">
        <label for="annee">Année</label>
        <input id="annee" type="text" placeholder="Ex : 2025" />
      </div>

      <div class="form-group">
        <label for="document">Document</label>
        <input id="document" type="file" />
      </div>

      <button type="submit">Ajouter la revue</button>
    </form>
  </div>
</div>
