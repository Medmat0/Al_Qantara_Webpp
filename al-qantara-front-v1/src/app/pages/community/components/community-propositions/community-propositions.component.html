<div class="community-propositions-root">
  <div class="title">REGARDEZ AUSSI CES COMMUNAUTES...</div>
  <div *ngIf="loading">Chargement des communautés...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="!loading && !error">
    <ng-container *ngIf="communities.length > 0; else noCommunities">
      <div *ngFor="let community of communities" class="community-prop-card" (click)="selectCommunity(community)">
        <div class="logo" *ngIf="community.logo">
          <img [src]="community.logo" alt="logo" />
        </div>
        <div class="info">
          <div class="name">{{ community.nom }}</div>
          <div class="members">{{ community.nbMembres | number:'1.0-0' }} membres</div>
        </div>
      </div>
    </ng-container>
    <ng-template #noCommunities>
      <div>Aucune communauté à proposer.</div>
    </ng-template>
  </div>
</div>
