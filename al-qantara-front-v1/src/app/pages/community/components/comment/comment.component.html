<div class="comments-container">
    <div class="comment-item" [class.is-reply]="comment.isReply">
        <!-- Comment header -->
        <div class="comment-header">
            <div class="comment-author-info">
                <img src="assets/default-avatar.jpg" alt="avatar" class="author-avatar">
                <div class="author-details">
                    <span class="author-name">{{ comment.auteur?.prenom || 'Utilisateur' }} {{ comment.auteur?.nom || '' }}</span>
                    <time class="comment-date">{{ comment.dateCreation | date:'dd/MM/yyyy HH:mm' }}</time>
                </div>
            </div>
                <div class="comment-menu">
                    <button class="menu-btn" (click)="toggleMenu()">
                        <span class="menu-icon">⋯</span>
                    </button>
                    <div class="menu-dropdown" [class.show]="showMenu">
                        <button class="menu-item" *ngIf="canEdit" (click)="editComment()">
                            <span class="menu-icon">✏️</span>
                            <span>Modifier</span>
                        </button>
                        <button class="menu-item delete" *ngIf="canDelete" (click)="deleteComment(comment)">
                            <span class="menu-icon">🗑️</span>
                            <span>Supprimer</span>
                        </button>
                        
                    </div>
                </div>
            </div>

            <!-- Comment content -->
            <div class="comment-content">
                <div class="comment-text" *ngIf="!isEditing">
                    <p>{{ comment.contenu }}</p>
                </div>
                
                <!-- Edit form -->
                <div class="edit-form" *ngIf="isEditing">
                    <textarea 
                        class="edit-textarea"
                        [(ngModel)]="editedContent"
                        placeholder="Modifier votre commentaire..."
                        rows="3">
                    </textarea>
                    <div class="edit-actions">
                        <button class="btn btn-primary" (click)="saveEdit()">
                            <span class="btn-icon">💾</span>
                            <span>Enregistrer</span>
                        </button>
                        <button class="btn btn-secondary" (click)="cancelEdit()">
                            <span class="btn-icon">❌</span>
                            <span>Annuler</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Comment actions -->
            <div class="comment-actions">
                <button class="action-btn like-btn" [class.liked]="isLiked" (click)="likeDislikeComment(comment)">
                    <span class="action-icon">{{ isLiked ? '❤️' : '🤍' }}</span>
                    <span class="action-text">J'aime</span>
                    <span class="action-count">{{ comment.likes?.length || 0 }}</span>
                </button>
                
                <button class="action-btn reply-btn" (click)="toggleReplyForm(comment.id)">
                    <span class="action-icon">💬</span>
                    <span class="action-text">Répondre</span>
                </button>
                
               
            </div>

            <!-- Reply form -->
            <div class="reply-form" *ngIf="replyFormVisible && replyFormVisible[comment.id]">
                <div class="reply-form-header">
                    <img [src]="" [alt]="currentUser.name" class="reply-avatar">
                    <span class="reply-to">Répondre à {{ comment.auteur.prenom }}</span>
                </div>
                <textarea 
                    class="reply-textarea"
                    [(ngModel)]="replyContent[comment.id]"
                    placeholder="Écrivez votre réponse..."
                    rows="3">
                </textarea>
                <div class="reply-actions">
                    <button class="btn btn-primary" (click)="submitReply()" [disabled]="!replyContent[comment.id]?.trim()">
                        <span class="btn-icon">📤</span>
                        <span>Envoyer</span>
                    </button>
                    <button class="btn btn-secondary" (click)="cancelReply()">
                        <span class="btn-icon">❌</span>
                        <span>Annuler</span>
                    </button>
                </div>
            </div>

            <!-- Nested replies -->
            <div class="replies-container" *ngIf="comment.replies?.length">
                <div class="replies-header">
                    <button class="toggle-replies" (click)="toggleReplies()">
                        <span class="toggle-icon">{{ showReplies ? '▼' : '▶' }}</span>
                        <span class="replies-count">{{ comment.replies.length }} réponse{{ comment.replies.length !== 1 ? 's' : '' }}</span>
                    </button>
                </div>
                
                <div class="replies-list" *ngIf="showReplies">
                    <app-comment
                        *ngFor="let reply of comment.replies"
                        [comment]="reply"
                        [userId]="userId"
                        [isModerator]="isModerator"
                        [replyFormVisible]="replyFormVisible"
                        [replyContent]="replyContent"
                        [toggleReplyForm]="toggleReplyForm"
                        [addReply]="addReply"
                        [likeDislikeComment]="likeDislikeComment"
                        [deleteComment]="deleteComment"
                        (reply)="addReply(reply.id)"
                        (toggleReplyForm)="toggleReplyForm(reply.id)"
                        (likeDislike)="likeDislikeComment($event)"
                        (delete)="deleteComment($event)">
                    </app-comment>
                </div>
            </div>
        </div>

        <!-- Loading state -->
        <div class="loading-state" *ngIf="isLoading">
            <div class="loading-spinner">
                <div class="spinner"></div>
            </div>
            <span class="loading-text">Chargement des commentaires...</span>
        </div>

        <!-- Empty state removed: handled by parent component only -->

        <!-- Error state -->
        <div class="error-state" *ngIf="error">
            <div class="error-icon">⚠️</div>
            <h3 class="error-title">Erreur de chargement</h3>
            <p class="error-description">{{ error }}</p>
            <button class="btn btn-primary" (click)="retry()">
                <span class="btn-icon">🔄</span>
                <span>Réessayer</span>
            </button>
        </div>
    </div>
