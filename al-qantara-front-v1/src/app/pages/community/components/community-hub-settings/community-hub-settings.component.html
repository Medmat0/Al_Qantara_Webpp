<div class="community-settings-container" *ngIf="!loading && community">
  <div class="community-card">
    <!-- Image à gauche -->
    <div class="community-image">
      <img [src]="community.logo" [alt]="community.nom" />
    </div>

    <!-- Formulaire à droite -->
    <div class="community-form">
      <h2>Modifier la communauté</h2>

      <form (ngSubmit)="modifyCommunity()">
        <div class="form-group">
          <label for="nom">Nom</label>
          <input id="nom" type="text" [(ngModel)]="community.nom" name="nom" placeholder="Nom de la communauté" />
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" [(ngModel)]="community.description" name="description" placeholder="Description de la communauté"></textarea>
        </div>

        <div class="form-group">
          <label for="logo">Logo (fichier)</label>
          <input id="logo" type="file" (change)="onLogoFileSelected($event)" name="logo" />
        </div>

        <div class="actions">
          <button type="submit" class="btn update">Modifier</button>
          <button type="button" class="btn delete" (click)="deleteCommunity()">Supprimer la communauté</button>
        </div>

        <div *ngIf="error" class="error-message">
          {{ error }}
        </div>
      </form>
    </div>
  </div>
</div>

<div *ngIf="loading" class="loading-state">
  Chargement...
</div>
