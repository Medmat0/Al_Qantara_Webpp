<div class="community-home-container">
  <div class="main-content">
    <div class="posts-section">
      <div class="posts-header">
        <h1 class="page-title">Communauté</h1>
        <div class="loading-indicator" *ngIf="loading">
          <div class="spinner"></div>
          <span>Chargement des posts...</span>
        </div>
      </div>

      <div class="error-message" *ngIf="error">
        <div class="error-icon">⚠️</div>
        <span>{{ error }}</span>
      </div>

      <div class="posts-container" *ngIf="!error" (scroll)="onScroll($event)">
        <ng-container *ngIf="posts.length > 0; else noPosts">
          <app-community-post
            *ngFor="let post of posts; trackBy: trackByPostId"
            [post]="post"
            [isModerator]="isModerator"
            (postEvent)="onPostEvent($event)"
            (click)="goToPost(post)"
            class="post-item">
          </app-community-post>
        </ng-container>
        <ng-template #noPosts>
          <div class="empty-state">
            <div class="empty-icon"></div>
            <h3>Aucun post à afficher</h3>
            <p>Soyez le premier à partager quelque chose avec la communauté !</p>
          </div>
        </ng-template>
        <div class="loading-indicator" *ngIf="loading">
          <div class="spinner"></div>
          <span>Chargement des posts...</span>
        </div>
      </div>
    </div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-content">
      <div class="action-buttons">
        <button
          class="btn btn-primary"
          (click)="openCommunityResearchPopup()">
          <span class="btn-icon"></span>
          Rechercher une communauté
        </button>
        <button
          class="btn btn-primary"
          (click)="openPostResearchPopup()">
          <span class="btn-icon"></span>
          Rechercher un post
        </button>

        <button
          class="btn btn-secondary"
          (click)="goToCreationForm()">
          <span class="btn-icon"></span>
          Créer une communauté
        </button>
      </div>

      <app-community-propositions
        (communitySelected)="onCommunitySelected($event)"
        class="community-propositions">
      </app-community-propositions>
    </div>
  </aside>
</div>

<!-- Overlay et popup recherche communauté -->
<div class="community-popup-overlay" *ngIf="showCommunityResearchPopup" (click)="closeCommunityResearchPopup()">
  <div class="community-popup" (click)="$event.stopPropagation()">
    <button class="close-popup" (click)="closeCommunityResearchPopup()">✖</button>
    <app-community-research (communitySelected)="onCommunitySelected($event)"></app-community-research>
  </div>
</div>

<!-- Overlay et popup recherche post -->
<div class="community-popup-overlay" *ngIf="showPostResearchPopup" (click)="closePostResearchPopup()">
  <div class="community-popup" (click)="$event.stopPropagation()">
    <button class="close-popup" (click)="closePostResearchPopup()">✖</button>
    <app-community-post-research></app-community-post-research>
  </div>
</div>

<!-- Modal d'authentification -->
<app-auth-required-modal
  *ngIf="showAuthModal"
  (close)="onAuthModalClose()">
</app-auth-required-modal>
