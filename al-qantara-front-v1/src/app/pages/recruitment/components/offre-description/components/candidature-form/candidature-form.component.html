<div *ngIf="hasAlreadyApplied; else showForm" class="already-applied-message">
  <div class="message-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 12l2 2 4-4"></path>
      <circle cx="12" cy="12" r="10"></circle>
    </svg>
  </div>
  <h3>Candidature déjà envoyée</h3>
  <p>Vous avez déjà candidaté à cette offre. Nous examinerons votre dossier et vous contacterons si votre profil correspond à nos besoins.</p>
</div>

<!-- Notification personnalisée -->
<div *ngIf="showNotification" class="custom-notification" [ngClass]="'notification-' + notificationType">
  <div class="notification-content">
    <div class="notification-icon">
      <svg *ngIf="notificationType === 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 12l2 2 4-4"></path>
        <circle cx="12" cy="12" r="10"></circle>
      </svg>
      <svg *ngIf="notificationType === 'error'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
      <svg *ngIf="notificationType === 'warning'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      <svg *ngIf="notificationType === 'info'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </div>
    <div class="notification-message">{{ notificationMessage }}</div>
    <button class="notification-close" (click)="closeNotification()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</div>
<ng-template #showForm>
  <form [formGroup]="candidatureForm" (ngSubmit)="onSubmit()">
    <!-- Section: Charger votre CV -->
    <div class="cv-upload-container">
        <label for="cv">Charger votre CV :</label>
        <input type="file" id="cv" name="cv" accept=".pdf" (change)="onFileSelected($event)" />
        <button type="button" (click)="autoFillForm()" [disabled]="!selectedCVFile || loadingCV" class="autofill-btn">Auto-remplir depuis le CV</button>
        <div class="circular-loader" *ngIf="loadingCV">
            <div class="spinner"></div>
        </div>
    </div>

    <div class="exp-comp-container">
        <!-- Expériences -->
        <div formArrayName="experiences">
            <label>Expériences professionnelles :</label>
            <div *ngFor="let expCtrl of experiences.controls; let i = index">
            <input
                type="text"
                [placeholder]="'Expérience ' + (i + 1)"
                [formControlName]="i"
                [class.is-invalid]="expCtrl.invalid && (expCtrl.touched || expCtrl.dirty)"
            />
            <button type="button" (click)="removeExperience(i)" *ngIf="experiences.length > 1">Supprimer</button>
            </div>
            <button type="button" (click)="addExperience()">Ajouter une expérience</button>
            <div *ngIf="experiences.invalid && (experiences.touched || experiences.dirty)" class="error">
            Au moins une expérience est requise.
            </div>
        </div>

        <!-- Compétences -->
        <div formArrayName="competences">
            <label>Compétences :</label>
            <div *ngFor="let compCtrl of competences.controls; let i = index">
            <input
                type="text"
                [placeholder]="'Compétence ' + (i + 1)"
                [formControlName]="i"
                [class.is-invalid]="compCtrl.invalid && (compCtrl.touched || compCtrl.dirty)"
            />
            <button type="button" (click)="removeCompetence(i)" *ngIf="competences.length > 1">Supprimer</button>
            </div>
            <button type="button" (click)="addCompetence()">Ajouter une compétence</button>
            <div *ngIf="competences.invalid && (competences.touched || competences.dirty)" class="error">
            Au moins une compétence est requise.
            </div>
        </div>
        </div>

    <!-- Section: Lettre de motivation -->
    <div>
        <label for="motivation">Lettre de motivation :</label>
        <textarea id="motivation" formControlName="motivation" rows="6"></textarea>
    </div>

    <button type="submit" [disabled]="candidatureForm.invalid || loadingSubmit">
        <span *ngIf="!loadingSubmit">Envoyer la candidature</span>
        <span *ngIf="loadingSubmit" class="submit-loading">
            <div class="spinner"></div>
            Envoi en cours...
        </span>
    </button>
  </form>
</ng-template>
